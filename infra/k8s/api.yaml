# The API (what the app talks to): uploads, cuts, exports, live progress on /live. Many copies
# behind one load balancer; live progress reaches every copy through Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: autocut
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: api } } }
      containers:
        - name: api
          image: autocut-server
          env:
            - { name: ROLE, value: api }
            - { name: GIT_SHA, value: __GIT_SHA__ }
            - { name: PORT, value: "8787" }
          envFrom:
            - secretRef: { name: autocut-env }
          ports: [{ containerPort: 8787 }]
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { memory: 2Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8787 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8787 }
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: autocut
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 8787 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: autocut
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # Live-progress connections stay open; uploads can take a while.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
    # The certificate for the host below is found in ACM automatically (see AWS.md).
spec:
  ingressClassName: alb
  tls:
    - hosts: [api.example.com] # your API address (infra/deploy.sh puts it in)
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { number: 80 } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: autocut
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 500
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: autocut
spec:
  minAvailable: 2
  selector: { matchLabels: { app: api } }
