# kubectl apply -k infra/k8s   (infra/deploy.sh fills in the images and the address)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - karpenter.yaml
  - api.yaml
  - workers.yaml
  - asr.yaml
  - pgbouncer.yaml
images:
  - name: autocut-server
    newName: ACCOUNT.dkr.ecr.REGION.amazonaws.com/autocut/server
    newTag: latest
  - name: autocut-server-gpu
    newName: ACCOUNT.dkr.ecr.REGION.amazonaws.com/autocut/server-gpu
    newTag: latest
  - name: autocut-asr
    newName: ACCOUNT.dkr.ecr.REGION.amazonaws.com/autocut/asr
    newTag: latest
