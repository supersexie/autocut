# Cut workers (CPU): join takes, read the audio, find what to cut. Speech-to-text goes to the asr
# service (GPU) first, then Deepgram if that fails.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-cut
  namespace: autocut
spec:
  replicas: 2
  selector: { matchLabels: { app: worker-cut } }
  template:
    metadata:
      labels: { app: worker-cut }
    spec:
      # Running jobs get DRAIN_SECONDS to finish when a copy is removed; the rest go back on the list.
      terminationGracePeriodSeconds: 660
      containers:
        - name: worker
          image: autocut-server
          env:
            - { name: ROLE, value: worker }
            - { name: GIT_SHA, value: __GIT_SHA__ }
            - { name: WORKER_KINDS, value: cut }
            - { name: CONCURRENCY, value: "8" }
            - { name: DRAIN_SECONDS, value: "600" }
            - { name: PROGRESS_MS, value: "2000" }
            - { name: ASR_URL, value: http://asr.autocut.svc.cluster.local }
            - { name: ASR_MAX, value: "8" }
            - { name: WHISPER_FALLBACK, value: "0" }
          envFrom:
            - secretRef: { name: autocut-env }
          resources:
            requests: { cpu: "4", memory: 6Gi, ephemeral-storage: 20Gi }
            limits: { memory: 10Gi }
---
# KEDA adds a cut worker for every 8 cuts waiting or running, and removes them as the list empties.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-cut
  namespace: autocut
spec:
  scaleTargetRef: { name: worker-cut }
  minReplicaCount: 2
  maxReplicaCount: 20000
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 200, periodSeconds: 15 }] }
        scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 10, periodSeconds: 60 }] }
  triggers:
    - type: metrics-api
      metadata:
        url: http://api.autocut.svc.cluster.local/queue?kinds=cut
        valueLocation: load
        targetValue: "8"
---
# Export workers (GPU, NVENC): exports and edit previews.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-render
  namespace: autocut
spec:
  replicas: 1
  selector: { matchLabels: { app: worker-render } }
  template:
    metadata:
      labels: { app: worker-render }
    spec:
      terminationGracePeriodSeconds: 660
      nodeSelector: { autocut/gpu: "true" }
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: worker
          image: autocut-server-gpu
          env:
            - { name: ROLE, value: worker }
            - { name: GIT_SHA, value: __GIT_SHA__ }
            - { name: WORKER_KINDS, value: "render,preview" }
            - { name: CONCURRENCY, value: "6" }
            - { name: DRAIN_SECONDS, value: "600" }
            - { name: PROGRESS_MS, value: "2000" }
            - { name: VIDEO_ENCODER, value: h264_nvenc }
          envFrom:
            - secretRef: { name: autocut-env }
          resources:
            requests: { cpu: "6", memory: 12Gi, ephemeral-storage: 40Gi }
            limits: { memory: 20Gi, nvidia.com/gpu: "1" }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-render
  namespace: autocut
spec:
  scaleTargetRef: { name: worker-render }
  minReplicaCount: 1
  maxReplicaCount: 10000
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 200, periodSeconds: 15 }] }
        scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 10, periodSeconds: 60 }] }
  triggers:
    - type: metrics-api
      metadata:
        url: http://api.autocut.svc.cluster.local/queue?kinds=render,preview
        valueLocation: load
        targetValue: "6"
