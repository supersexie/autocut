<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autocut, Edits and CapCut style 3</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#F4F4F6;--ink:#111114;--muted:#6B6B73}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0e;--card:#1a1a1d;--ink:#f4f4f6;--muted:#9a9aa2}}
:root[data-theme="dark"]{--bg:#0c0c0e;--card:#1a1a1d;--ink:#f4f4f6;--muted:#9a9aa2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:40px 16px 60px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;letter-spacing:-1px;margin:0}
.sub{color:var(--muted);margin:8px 0 28px;font-size:15px;line-height:1.5;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:baseline;gap:8px}
.num{font-weight:700;font-size:13px;color:var(--muted)}
.name{font-weight:700;font-size:16px}
.note{color:var(--muted);font-size:13px;line-height:1.45}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tile{width:92px;height:92px;border-radius:21px;display:grid;place-items:center;flex:none;overflow:hidden}
.tile svg{width:100%;height:100%;display:block}
.dark{background:#000;color:#fff}
.light{background:#fff;color:#111114;box-shadow:inset 0 0 0 1px #E6E6EA}
.mini{width:30px;height:30px;border-radius:7px}
.minis{display:flex;flex-direction:column;gap:8px}
.word{display:flex;align-items:center;gap:8px;background:#fff;color:#111114;border-radius:12px;padding:8px 10px;box-shadow:inset 0 0 0 1px #E6E6EA}
.word .tile{width:26px;height:26px;border-radius:7px}
.word span{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.3px}
</style></head>
<body><main>
<h1>Autocut, Edits and CapCut style, round 3</h1>
<p class="sub">Built like the Edits and CapCut icons: a clip drawn as rounded brackets, plus one cut, in two or three thick strokes. Each is shown white on black, black on white, Edits-style (gradient clip, white cut), small, and with the wordmark.</p>
<div class="grid" id="grid"></div>
</main>
<script>
let uid = 0;
const W = 10; // stroke width (of 100), as heavy as Edits
const line = (d, paint, extra = '') => `<path d="${d}" fill="none" stroke="${paint}" stroke-width="${W}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const masked = (inner, cut) => { const id = 'm' + uid++; return `<mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/>${cut}</mask><g mask="url(#${id})">${inner}</g>`; };
const gap = (x, w = 14) => `<rect x="${x - w / 2}" y="0" width="${w}" height="100" fill="#000"/>`;

// Clips drawn as brackets: wide (room for something inside) and narrow (like Edits).
const LB = 'M34 26 H30 Q18 26 18 38 V62 Q18 74 30 74 H34', RB = 'M66 26 H70 Q82 26 82 38 V62 Q82 74 70 74 H66';
const LBn = 'M40 26 H36 Q24 26 24 38 V62 Q24 74 36 74 H40', RBn = 'M60 26 H64 Q76 26 76 38 V62 Q76 74 64 74 H60';
const PILL = 'M34 34 H66 A16 16 0 0 1 66 66 H34 A16 16 0 0 1 34 34 Z';

// draw(p, a): p paints the clip, a the cut / playhead (white in the Edits-style version).
const SQ = 'M38 24 H62 Q76 24 76 38 V62 Q76 76 62 76 H38 Q24 76 24 62 V38 Q24 24 38 24 Z';
const band = (d, w = 18) => `<path d="${d}" fill="none" stroke="#000" stroke-width="${w}" stroke-linecap="round"/>`;
const poly = (pts) => `<polygon points="${pts}" fill="#000"/>`;
const TRI = 'M30 24 V76 L76 50 Z', TALL = 'M40 18 H60 Q70 18 70 28 V72 Q70 82 60 82 H40 Q30 82 30 72 V28 Q30 18 40 18 Z';
const RING = 'M24 50 A26 26 0 1 0 76 50 A26 26 0 1 0 24 50', PILL2 = 'M32 36 H68 A14 14 0 0 1 68 64 H32 A14 14 0 0 1 32 36 Z';
const split = (d, p, keepA, keepB, ta, tb) => `<g transform="translate(${ta})">${masked(line(d, p), keepA)}</g><g transform="translate(${tb})">${masked(line(d, p), keepB)}</g>`;
const LOGOS = [
  { name: 'Notch clip', note: 'A clip with a notch snipped out of its edge.',
    draw: (p) => line('M30 32 H43 L50 43 L57 32 H70 Q82 32 82 44 V56 Q82 68 70 68 H30 Q18 68 18 56 V44 Q18 32 30 32 Z', p) },
  { name: 'Play apart', note: 'Play taken apart: its back edge, then its point.',
    draw: (p, a) => line('M28 28 V72', p) + line('M44 28 L74 50 L44 72', a) },
  { name: 'Corner play', note: 'One corner of the frame and play: the shot, ready to go.',
    draw: (p, a) => line('M24 50 V34 Q24 24 34 24 H50', p) + line('M46 44 V76 L78 60 Z', a, 'stroke-width="9"') },
  { name: 'C for cut', note: 'An open C with the cut flying past the gap.',
    draw: (p, a) => line('M70.7 32.6 A27 27 0 1 0 70.7 67.4', p) + line('M84 37 L72 63', a) },
  { name: 'Cut ring', note: 'A ring sliced in two, the halves slipping apart.',
    draw: (p) => split(RING, p, poly('56,0 100,0 100,100 40,100'), poly('0,0 64,0 48,100 0,100'), '-3 3', '3 -3') },
  { name: 'Step', note: 'One line that jumps up a step: a jump cut, drawn plainly.',
    draw: (p) => line('M20 66 H48 V34 H80', p) },
  { name: 'Voice clip', note: 'A clip with a voice wave inside it.',
    draw: (p, a) => line(LBn, p) + line(RBn, p) + line('M39 50 Q44.5 42 50 50 Q55.5 58 61 50', a, 'stroke-width="7"') },
  { name: 'Removed', note: 'A clip with a dash where the bad part used to be.',
    draw: (p, a) => line(LBn, p) + line(RBn, p) + line('M42 50 H58', a) },
  { name: 'Skip ahead', note: 'Two chevrons: skip straight past the dead air.',
    draw: (p) => line('M26 32 L42 50 L26 68', p) + line('M52 32 L68 50 L52 68', p) },
  { name: 'Stacked takes', note: 'Two takes, one behind the other, like the Edits icon’s layers.',
    draw: (p, a) => masked(line('M44 20 H70 Q80 20 80 30 V56 Q80 66 70 66 H44 Q34 66 34 56 V30 Q34 20 44 20 Z', p), '<rect x="12" y="26" width="62" height="62" rx="18" fill="#000"/>') + line('M30 34 H56 Q66 34 66 44 V70 Q66 80 56 80 H30 Q20 80 20 70 V44 Q20 34 30 34 Z', a) },
  { name: 'Split', note: 'A frame with one line down the middle: where the cut goes.',
    draw: (p, a) => line(SQ, p) + line('M50 39 V61', a) },
  { name: 'Crop play', note: 'Two crop corners around play: trimmed to what matters.',
    draw: (p, a) => line('M24 44 V32 Q24 24 32 24 H44', p) + line('M76 56 V68 Q76 76 68 76 H56', p) + line('M42 36 V64 L66 50 Z', a, 'stroke-width="8"') },
  { name: 'Timeline cut', note: 'The timeline broken where the cut goes through.',
    draw: (p, a) => line('M18 50 H36', p) + line('M64 50 H82', p) + line('M58 30 L42 70', a) },
  { name: 'Clip jump', note: 'A clip split in two, the second half jumping up.',
    draw: (p) => split(PILL2, p, '<rect x="47" y="0" width="53" height="100" fill="#000"/>', '<rect x="0" y="0" width="53" height="100" fill="#000"/>', '-6 4', '6 -4') },
  { name: 'Trim in', note: 'The start of a clip with the arrow trimming it in.',
    draw: (p, a) => line('M40 26 H34 Q22 26 22 38 V62 Q22 74 34 74 H40', p) + line('M80 50 H52', a) + line('M63 38 L51 50 L63 62', a) },
  { name: 'Record', note: 'A frame with a dot: hit record, Autocut does the rest.',
    draw: (p, a) => line(SQ, p) + `<circle cx="50" cy="50" r="12" fill="${a}"/>` },
  { name: 'Double play', note: 'Two plays side by side: edit more than one at once.',
    draw: (p, a) => line('M18 33 V67 L44 50 Z', p, 'stroke-width="8"') + line('M56 33 V67 L82 50 Z', a, 'stroke-width="8"') },
  { name: 'Short, cut', note: 'A 9:16 frame with a cut straight through it.',
    draw: (p, a) => masked(line(TALL, p), band('M72 28 L28 72')) + line('M74 26 L26 74', a, 'stroke-width="6"') },
  { name: 'Audio jump', note: 'A sound wave cut in the middle, the second half jumping up.',
    draw: (p) => line('M16 52 Q24 38 32 52 Q40 66 48 52', p) + line('M52 46 Q60 32 68 46 Q76 60 84 46', p) },
  { name: 'Bracket chevron', note: 'The start of a clip and a chevron: the clip, moving on.',
    draw: (p, a) => line('M44 26 H36 Q24 26 24 38 V62 Q24 74 36 74 H44', p) + line('M54 32 L74 50 L54 68', a) },
];

const grad = () => { const id = 'g' + uid++; return { id, def: `<defs><linearGradient id="${id}" x1="15" y1="85" x2="85" y2="15" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7B3FF2"/><stop offset=".45" stop-color="#FF0A78"/><stop offset=".8" stop-color="#FF7A1A"/><stop offset="1" stop-color="#FFC21A"/></linearGradient></defs>` }; };
const svg = (inner) => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const mono = (l) => svg(l.draw('currentColor', 'currentColor'));
const colour = (l) => { const g = grad(); return svg(g.def + l.draw(`url(#${g.id})`, '#fff')); };

document.getElementById('grid').innerHTML = LOGOS.map((l, i) => `
  <section class="card">
    <div class="head"><span class="num">${String(i + 47).padStart(2, '0')}</span><span class="name">${l.name}</span></div>
    <div class="note">${l.note}</div>
    <div class="row">
      <div class="tile dark">${mono(l)}</div>
      <div class="tile light">${mono(l)}</div>
      <div class="tile dark">${colour(l)}</div>
      <div class="minis"><div class="tile dark mini">${mono(l)}</div><div class="tile dark mini">${colour(l)}</div></div>
    </div>
    <div class="word"><div class="tile dark">${mono(l)}</div><span>Autocut</span></div>
  </section>`).join('');
</script>
</body></html>
