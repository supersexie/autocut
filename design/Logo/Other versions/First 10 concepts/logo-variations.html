<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autocut logo options</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#F4F4F6;--ink:#111114;--muted:#6B6B73;--line:#E6E6EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0e;--card:#1a1a1d;--ink:#f4f4f6;--muted:#9a9aa2;--line:#2a2a2e}}
:root[data-theme="dark"]{--bg:#0c0c0e;--card:#1a1a1d;--ink:#f4f4f6;--muted:#9a9aa2;--line:#2a2a2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:40px 16px 60px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;letter-spacing:-1px;margin:0}
.sub{color:var(--muted);margin:8px 0 28px;font-size:15px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:baseline;gap:8px}
.num{font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.name{font-weight:700;font-size:16px}
.note{color:var(--muted);font-size:13px;line-height:1.45;min-height:38px}
.row{display:flex;align-items:center;gap:14px}
.tile{width:96px;height:96px;border-radius:22px;display:grid;place-items:center;flex:none;overflow:hidden}
.tile svg,.tile img{width:100%;height:100%;display:block}
.dark{background:#111114;color:#fff}
.light{background:#fff;color:#111114;box-shadow:inset 0 0 0 1px #E6E6EA}
.small{display:flex;flex-direction:column;gap:10px}
.mini{width:32px;height:32px;border-radius:8px}
.word{display:flex;align-items:center;gap:8px;background:#fff;color:#111114;border-radius:12px;padding:8px 10px;box-shadow:inset 0 0 0 1px #E6E6EA}
.word .tile{width:26px;height:26px;border-radius:7px}
.word span{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.3px}
.current{outline:2px solid var(--ink)}
@media (max-width:420px){.tile{width:84px;height:84px}}
</style></head>
<body><main>
<h1>Autocut logo options</h1>
<p class="sub">Ten takes on “play + cut”, in the app’s black-and-white look. Each one is shown as the app icon, on white, small (the size it shows in Settings), and next to the wordmark. The current logo is first, for comparison.</p>
<div class="grid" id="grid"></div>
</main>

    svg: () => tri('44,36 44,64 64,50') + '<path d="M32 25 H25 V75 H32" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 25 H75 V75 H68" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>' },
  { name: 'Playhead', note: 'The playhead cutting straight through a play button.',
    svg: () => masked(tri(), '<rect x="51" y="0" width="7" height="100" fill="#000"/>') + '<circle cx="54.5" cy="13" r="4.5" fill="currentColor"/>' },
  { name: 'Button', note: 'A solid round button with a sliced play cut out of it. Bold at small sizes.',
    svg: () => masked('<circle cx="50" cy="50" r="36" fill="currentColor"/>', tri('42,33 42,67 69,50').replaceAll('currentColor', '#000') + '<polygon points="30,62 80,34 80,40 30,68" fill="#fff"/>') },
  { name: 'A for Autocut', note: 'A rounded “A” that is also a play button turned on its side.',
    svg: () => masked('<polygon points="50,20 81,77 19,77" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>', '<polygon points="50,49 60,66 40,66" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/><rect x="0" y="69" width="100" height="5" fill="#000"/>') },
  { name: 'Caption', note: 'A speech bubble with a sliced play inside: cuts and captions in one.',
    svg: () => masked('<rect x="17" y="20" width="66" height="50" rx="15" fill="currentColor"/><polygon points="29,66 29,83 46,66" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>',
      tri('42,33 42,57 62,45').replaceAll('currentColor', '#000').replace('stroke-width="7"', 'stroke-width="5"') + '<polygon points="34,54 70,34 70,39 34,59" fill="#fff"/>') },
];

const svgTag = (inner) => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const draw = (l) => l.current ? `<img src="${CURRENT}" alt="">` : svgTag(l.svg());
const lightOf = (l) => l.current ? `<img src="${CURRENT}" alt="" style="filter:invert(1)">` : svgTag(l.svg());

document.getElementById('grid').innerHTML = LOGOS.map((l, i) => `
  <section class="card ${l.current ? 'current' : ''}">
    <div class="head"><span class="num">${l.current ? 'NOW' : String(i).padStart(2, '0')}</span><span class="name">${l.name}</span></div>
    <div class="note">${l.note}</div>
    <div class="row">
      <div class="tile dark">${draw(l)}</div>
      <div class="tile light">${lightOf(l)}</div>
      <div class="small">
        <div class="tile dark mini">${draw(l)}</div>
        <div class="tile light mini">${lightOf(l)}</div>
      </div>
    </div>
    <div class="word"><div class="tile dark">${draw(l)}</div><span>Autocut</span></div>
  </section>`).join('');
</script>
</body></html>
